name: PhD audio preview
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: Markdown lesson path
        required: true
        default: ai-for-cybersecurity/lessons/2026-11-01/lesson.md
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install Kokoro speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -r automation/requirements.txt
      - name: Generate neural speech MP3
        env:
          LESSON_PATH: ${{ inputs.lesson }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python automation/narrate.py "$LESSON_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: phd-neural-audio
          path: '**/lessons/**/*.mp3'
          if-no-files-found: error
