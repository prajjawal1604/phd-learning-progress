name: PhD audio preview
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: Markdown lesson path
        required: true
        default: ai-for-cybersecurity/lessons/2026-11-01/lesson.md
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r automation/requirements.txt
      - run: python automation/narrate.py "${{ inputs.lesson }}"
      - uses: actions/upload-artifact@v4
        with:
          name: phd-lesson-audio
          path: '**/lessons/**/*.mp3'
          if-no-files-found: error
