name: PhD audio preview
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: Markdown lesson path
        required: true
        default: ai-for-cybersecurity/lessons/2026-11-01/lesson.md
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install offline speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate MP3 without external speech APIs
        env:
          LESSON_PATH: ${{ inputs.lesson }}
        run: python3 automation/narrate.py "$LESSON_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: phd-lesson-audio
          path: '**/lessons/**/*.mp3'
          if-no-files-found: error
